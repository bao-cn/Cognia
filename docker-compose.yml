name: cognia

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cognia}
      POSTGRES_USER: ${DB_USER:-cognia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cognia}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cognia} -d ${DB_NAME:-cognia}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cognia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cognia-secret}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cognia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cognia-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-cognia}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        echo "bucket ready: $$MINIO_BUCKET"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cognia}
      DB_USERNAME: ${DB_USER:-cognia}
      DB_PASSWORD: ${DB_PASSWORD:-cognia}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-please-32-bytes}
      SETTINGS_SECRET: ${SETTINGS_SECRET:-dev-only-settings-secret-change-me-32-chars}
      APP_TIME_ZONE: Asia/Shanghai
      MAIL_EXPOSE_CODE: "false"
      INIT_DATA_ENABLED: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cognia.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      OPENAI_API_KEY: sk-cognia-placeholder
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/settings/public >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build:
      context: ./cognia-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
